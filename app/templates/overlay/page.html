<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Оверлей — {{ tournament.name }}</title>
  <!-- Same CDN link as base.html — needed here too now that the idle
       hero's "last_game" mode reuses the site's own .match-card, whose
       icons (bi-shield-fill etc.) come from this font. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/overlay.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/broadcast-scenes.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/overlay-enhancements.css') }}">
</head>
<body>
  <div id="overlay-root"
       data-fragment-url="{{ url_for('overlay.overlay_fragment', tournament_id=tournament.id) }}"
       data-poll-interval-ms="5000"
       data-reveal-duration-ms="25000"
       data-ticker-interval-ms="8000">
    {% include "overlay/_fragment.html" %}
  </div>
  <script src="{{ url_for('static', filename='js/broadcast-scenes.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/overlay.js') }}" defer></script>
</body>
</html>
