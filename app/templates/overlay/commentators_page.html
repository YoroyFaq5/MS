<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Оверлей — Live: Комментаторы — {{ tournament.name }}</title>
  <!-- Same CDN link as base.html — needed here too since the idle-hero's
       "last_game" mode reuses the site's own .match-card, whose icons
       (bi-shield-fill etc.) come from this font. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/overlay.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/broadcast-brand.css') }}">
</head>
<body>
  <div id="overlay-root"
       data-fragment-url="{{ fragment_url }}"
       data-poll-interval-ms="5000"
       data-reveal-duration-ms="25000"
       data-ticker-interval-ms="8000">
    {% include "overlay/_live_fragment.html" %}
  </div>
  <script src="{{ url_for('static', filename='js/overlay-marquee.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/overlay-chat.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/overlay.js') }}" defer></script>
</body>
</html>
